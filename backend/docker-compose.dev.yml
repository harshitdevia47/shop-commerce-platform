# Local infrastructure for development and tests.
# Services themselves run on the host with `npm run dev -w @qc/<service>`.
name: qc-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: qc
      POSTGRES_PASSWORD: qc_dev_password
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ../deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
