# HTTPS configuration. After obtaining certificates (docs/deploy.md, "TLS"):
#   cp nginx/nginx.tls.conf nginx/nginx.conf, replace api.example.in, docker compose up -d nginx
worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  client_max_body_size 10m;

  gzip on;
  gzip_types application/json text/plain text/css application/javascript;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream gateway { server gateway:3000; keepalive 32; }
  upstream realtime { server realtime:3000; }
  upstream platform { server platform:3000; }

  # Platform admin site: own certificate (certbot -d admin.example.in), own login.
  server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.in;

    ssl_certificate     /etc/nginx/certs/live/admin.example.in/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/admin.example.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://platform;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 30s;
    }
  }

  # Port 80: certificate renewals only; everything else moves to HTTPS.
  server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    # default_server: unknown hosts get the API, never the admin site.
    listen 443 ssl default_server;
    http2 on;
    server_name api.example.in;

    ssl_certificate     /etc/nginx/certs/live/api.example.in/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/api.example.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /media/ {
      alias /srv/media/;
      expires 30d;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }

    location /socket.io/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://realtime;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
    }

    location / {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }
  }
}
