worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  client_max_body_size 10m;

  gzip on;
  gzip_types application/json text/plain text/css application/javascript;
  gzip_min_length 1024;

  # Coarse per-IP flood protection; fine-grained limits live in the gateway.
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream gateway { server gateway:3000; keepalive 32; }

  server {
    listen 80;
    server_name _;
    # TLS: obtain certs with certbot on the host, mount into ./certs, then
    # replace this block's body with:  return 301 https://$host$request_uri;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /media/ {
      alias /srv/media/;
      expires 30d;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location / {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # Socket.IO (realtime service, Phase 4) will be added here with Upgrade headers.
  }
}
