# Production stack for a single VPS.
#   cd deploy && cp .env.example .env  (fill in secrets)
#   docker compose up -d --build
# Only nginx is reachable from outside; services talk over the internal network.
name: qc

x-service: &service
  restart: unless-stopped
  env_file: .env
  networks: [internal]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    <<: *service
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      retries: 20

  redis:
    <<: *service
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  tenant:
    <<: *service
    # Builds the one backend image all services share (they start after it is built).
    build: { context: ../backend, dockerfile: Dockerfile }
    image: qc-backend:latest
    working_dir: /app/services/tenant
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/qc_tenant
      # For `docker compose exec tenant node dist/client.js sync <slug>`
      CLIENTS_DIR: /clients
    volumes:
      - ../clients:/clients:ro
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 256m } }

  identity:
    <<: *service
    image: qc-backend:latest
    pull_policy: never
    working_dir: /app/services/identity
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/qc_identity
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      TENANT_URL: http://tenant:3000
      ORDER_URL: http://order:3000
      # SMS_PROVIDER (whatsapp | msg91), WHATSAPP_PHONE_NUMBER_ID / MSG91_OTP_TEMPLATE_ID come from .env;
      # tokens from files in secrets/sms (docs/deploy.md, "Login codes").
      MSG91_AUTH_KEY_FILE: ${MSG91_AUTH_KEY_FILE:-}
      WHATSAPP_ACCESS_TOKEN_FILE: ${WHATSAPP_ACCESS_TOKEN_FILE:-}
    volumes:
      - ./secrets/sms:/run/sms:ro
    secrets: [jwt_private_key]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 256m } }

  catalog:
    <<: *service
    image: qc-backend:latest
    pull_policy: never
    working_dir: /app/services/catalog
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/qc_catalog
      REDIS_URL: redis://redis:6379
      TENANT_URL: http://tenant:3000
      MEDIA_URL: http://media:3000
      ORDER_URL: http://order:3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 256m } }

  media:
    <<: *service
    image: qc-backend:latest
    pull_policy: never
    working_dir: /app/services/media
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/qc_media
      MEDIA_ROOT: /data
      MEDIA_PUBLIC_PATH: /media
      MEDIA_SERVE_STATIC: "false"
      TENANT_URL: http://tenant:3000
    volumes:
      - media:/data/public
      - media_private:/data/private
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      # sharp needs headroom to decode phone photos
      resources: { limits: { memory: 384m } }

  payment:
    <<: *service
    image: qc-backend:latest
    pull_policy: never
    working_dir: /app/services/payment
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/qc_payment
      REDIS_URL: redis://redis:6379
      TENANT_URL: http://tenant:3000
      ORDER_URL: http://order:3000
      # One Razorpay credentials file per shop: secrets/razorpay/<slug>.json (docs/deploy.md).
      RAZORPAY_ACCOUNTS_DIR: /run/razorpay
    volumes:
      - ./secrets/razorpay:/run/razorpay:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 256m } }

  order:
    <<: *service
    image: qc-backend:latest
    pull_policy: never
    working_dir: /app/services/order
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/qc_order
      REDIS_URL: redis://redis:6379
      TENANT_URL: http://tenant:3000
      IDENTITY_URL: http://identity:3000
      CATALOG_URL: http://catalog:3000
      PAYMENT_URL: http://payment:3000
      MEDIA_URL: http://media:3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 256m } }

  # Riders: assignment, pickup, delivery OTP; latest rider location in Redis.
  delivery:
    <<: *service
    image: qc-backend:latest
    pull_policy: never
    working_dir: /app/services/delivery
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/qc_delivery
      REDIS_URL: redis://redis:6379
      ORDER_URL: http://order:3000
      IDENTITY_URL: http://identity:3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 256m } }

  # Sales read models from order/payment events; owner reports.
  reporting:
    <<: *service
    image: qc-backend:latest
    pull_policy: never
    working_dir: /app/services/reporting
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/qc_reporting
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 192m } }

  # API of the platform owner's Shop Admin app (subscriptions), reached through nginx at admin.<domain>.
  platform:
    <<: *service
    image: qc-backend:latest
    pull_policy: never
    working_dir: /app/services/platform
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/qc_platform
      REDIS_URL: redis://redis:6379
      TENANT_URL: http://tenant:3000
      IDENTITY_URL: http://identity:3000
      CATALOG_URL: http://catalog:3000
      REPORTING_URL: http://reporting:3000
      # ADMIN_EMAILS, LOGIN_CODE_SECRET, MAIL_*, PLATFORM_*, PUSH_PROVIDER come from .env; the Gmail app
      # password and the Firebase service account (same as notification) from files (docs/deploy.md, 6e).
      MAIL_APP_PASSWORD_FILE: ${MAIL_APP_PASSWORD_FILE:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
    volumes:
      - ./secrets/mail:/run/mail:ro
      - ./secrets/fcm:/run/fcm:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 192m } }

  # Turns events into push notifications. No routes besides /health.
  notification:
    <<: *service
    image: qc-backend:latest
    pull_policy: never
    working_dir: /app/services/notification
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/qc_notification
      REDIS_URL: redis://redis:6379
      TENANT_URL: http://tenant:3000
      IDENTITY_URL: http://identity:3000
      # PUSH_PROVIDER (console | fcm) comes from .env. For fcm, put the Firebase service account
      # at deploy/secrets/fcm/service-account.json (gitignored).
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
    volumes:
      - ./secrets/fcm:/run/fcm:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 192m } }

  # Socket.IO for live order updates; nginx proxies /socket.io/ here directly.
  realtime:
    <<: *service
    image: qc-backend:latest
    pull_policy: never
    working_dir: /app/services/realtime
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      DELIVERY_URL: http://delivery:3000
    secrets: [jwt_public_key]
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 192m } }

  gateway:
    <<: *service
    image: qc-backend:latest
    pull_policy: never
    working_dir: /app/services/gateway
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      TENANT_URL: http://tenant:3000
      IDENTITY_URL: http://identity:3000
      CATALOG_URL: http://catalog:3000
      MEDIA_URL: http://media:3000
      ORDER_URL: http://order:3000
      PAYMENT_URL: http://payment:3000
      DELIVERY_URL: http://delivery:3000
      REPORTING_URL: http://reporting:3000
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      TRUST_PROXY_HOPS: 1
    secrets: [jwt_public_key]
    depends_on:
      redis: { condition: service_healthy }
      tenant: { condition: service_started }
      identity: { condition: service_started }
      catalog: { condition: service_started }
      media: { condition: service_started }
      order: { condition: service_started }
      payment: { condition: service_started }
      delivery: { condition: service_started }
      reporting: { condition: service_started }
    deploy:
      resources: { limits: { memory: 256m } }

  # Monitoring (optional): `docker compose --profile monitoring up -d uptime-kuma`, then open it
  # through an SSH tunnel: ssh -L 3001:localhost:3001 deploy@server  ->  http://localhost:3001
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16-alpine
    profiles: [monitoring]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptimekuma:/app/data
    networks: [internal]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
      - media:/srv/media:ro
    networks: [internal]
    depends_on: [gateway, realtime, platform]

networks:
  internal:

volumes:
  pgdata:
  uptimekuma:
  # HTTP-01 challenge files written by certbot (see docs/deploy.md, TLS).
  certbot-webroot:
  redisdata:
  # Public images: written by the media service, served read-only by nginx at /media.
  media:
  # Private uploads (prescriptions, payment proofs): only the media service mounts this.
  media_private:

secrets:
  jwt_public_key:
    file: ./secrets/jwt-public.pem
  jwt_private_key:
    file: ./secrets/jwt-private.pem
