name: qc_app
description: White-label quick-commerce ordering app (one codebase, one flavor per client shop).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  dio: ^5.8.0
  shared_preferences: ^2.5.0
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  flutter_secure_storage: ^11.2.0
  cached_network_image: ^4.0.7
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  socket_io_client: ^3.1.6
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.4
  geolocator: ^14.0.1
  razorpay_flutter: ^1.4.7
  file_picker: ^13.4.1
  excel: ^4.0.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # BEGIN GENERATED CLIENT ASSETS (tool/gen_flavors.dart; do not edit by hand)
    - path: assets/clients/sharma_kirana/
      flavors:
        - sharma_kirana
    - path: assets/clients/style_hub/
      flavors:
        - style_hub
    # END GENERATED CLIENT ASSETS
